[build]
  publish = "."

[[edge_functions]]
  function = "auth"
  path = "/*"

[[redirects]]
  from = "/jev-board/api/*"
  to = "https://jev-board-api.roko-experiments.workers.dev/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
